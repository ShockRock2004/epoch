<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Epoch: a beginner's introduction to machine learning in 50 days">
  <title>Epoch</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#5B1A9A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#07040C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="72%" cy="0%" r="40%">
      <stop offset="0%" stop-color="#D946EF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0ABFC"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#07040C"/>
    <rect width="1200" height="380" fill="url(#glow)"/>
    <rect width="1200" height="380" fill="url(#pink)"/>
    <g fill="none" stroke="#A78BFA" stroke-opacity="0.10">
      <circle cx="600" cy="560" r="300"/>
      <circle cx="600" cy="560" r="420"/>
      <circle cx="600" cy="560" r="540"/>
    </g>
    <g fill="#E9D5FF" fill-opacity="0.5">
      <circle cx="180" cy="70" r="1.6"/><circle cx="1030" cy="110" r="1.4"/>
      <circle cx="1090" cy="335" r="1.2"/><circle cx="120" cy="330" r="1.3"/>
      <circle cx="1110" cy="230" r="1.1"/><circle cx="90" cy="190" r="1.2"/>
    </g>
  </g>
  <g transform="translate(600 120)">
    <circle r="44" fill="none" stroke="#B57BFF" stroke-width="12" stroke-opacity="0.35" filter="url(#soft)"/>
    <path d="M 27.8 -34.1 A 44 44 0 1 1 13.6 -41.8" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <circle cx="27" cy="-38" r="8" fill="url(#dot)"/>
  </g>
  <text x="600" y="246" text-anchor="middle" font-family="Sora, Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="1">Epoch</text>
  <text x="600" y="296" text-anchor="middle" font-family="Sora, Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#C084FC" letter-spacing="5">MACHINE LEARNING · 50 DAYS · TWO EPISODES A DAY</text>
</svg>
